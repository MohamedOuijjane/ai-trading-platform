services:
  backend:
    build: ./backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=trading
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - ML_SERVICE_URL=http://ml-service:8000/api/v1/predict/
      - DEBUG=False
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - app-network
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - app-network

  ml-service:
    build: ./ml_service
    volumes:
      - ./ml_service/model:/app/model
      - ./ml_service/data:/app/data
    ports:
      - "5000:8000"
    environment:
      - WEB_CONCURRENCY=2
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: always

  redis:
    image: redis:7
    networks:
      - app-network

  celery:
    build: ./backend
    command: celery -A config worker -l info
    depends_on:
      - redis
      - db
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
      - ml-service
    networks:
      - app-network
    restart: always

# 🔧 Explicitly define volumes for persistence
volumes:
  postgres_data:

# 🔧 Explicitly define an internal network for service isolation
networks:
  app-network:
    driver: bridge
